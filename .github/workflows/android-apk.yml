# Builds the three Android apps (APK) and posts them on the Releases page:
# https://github.com/earvin-Icharge/Sunny-Foods/releases/tag/android-latest
name: Android APKs

on:
  push:
    branches: [build/v1, main]
    paths: ["mobile/apk/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - { key: staff, file: SunnyFoods-Staff.apk }
          - { key: order, file: SunnyFoods-Order.apk }
          - { key: agent, file: SunnyFoods-Agent.apk }
    env:
      APP_VERSION: "0.1.${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3

      - name: Build signed APK
        run: mobile/apk/build-one.sh ${{ matrix.app.key }} ${{ matrix.app.file }} ${{ github.run_number }} "$APP_VERSION"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.app.key }}
          path: ${{ matrix.app.file }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with: { path: apks, merge-multiple: true }
      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release delete android-latest --repo "$REPO" --yes --cleanup-tag || true
          gh release create android-latest apks/*.apk --repo "$REPO" --target "${{ github.sha }}" --prerelease \
            --title "Sunny Foods Android apps (test) — build ${{ github.run_number }}" \
            --notes "Install on Android: download the APK on the phone, open it, allow 'Install unknown apps' when asked. Staff = workers/office/drivers, Order = customers, Agent = agents/brokers. Test build: a new version may need the old app removed first."
